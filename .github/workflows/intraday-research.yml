name: Intraday research checks

on:
  push:
    paths:
      - "scripts/intraday_backtest.py"
      - "scripts/intraday_research.py"
      - "scripts/download_dhan_5m.py"
      - "scripts/test_intraday_backtest.py"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pandas numpy requests
      - run: python -m py_compile scripts/intraday_backtest.py scripts/intraday_research.py scripts/download_dhan_5m.py
      - run: python scripts/test_intraday_backtest.py
