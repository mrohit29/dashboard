name: EOD Delivery Data
on:
  schedule:
    - cron: "0 12 * * 1-5" # 17:30 IST weekdays
  workflow_dispatch:
jobs:
  update-delivery:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/eod_delivery_fetch.py
      - name: Commit delivery data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eod_delivery.json
          git diff --cached --quiet || git commit -m "Update EOD delivery metrics"
          git push
