name: Run stock scanner every 5 minutes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run type"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - historical
      date:
        description: "Historical trading date (used only in historical mode)"
        required: true
        default: "2026-09-23"
        type: string

  # 04:00 UTC = 09:30 IST. The job itself also waits for 09:30 IST
  # before scanning, so scheduler delays/early starts cannot create early alerts.
  schedule:
    - cron: "0 4 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas pandas-ta requests pytz

      - name: Run live scanner continuously
        if: github.event_name == 'schedule' || inputs.mode == 'live'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          set -e

          echo "Continuous scanner job started at $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z')"

          # Wait until 09:30 IST before the first scan.
          while true; do
            NOW=$(TZ=Asia/Kolkata date '+%H:%M')
            if [[ "$NOW" > "09:29" ]]; then
              break
            fi
            echo "Waiting for 09:30 IST. Current time: $NOW IST"
            sleep 30
          done

          while true; do
            NOW=$(TZ=Asia/Kolkata date '+%H:%M')

            # Stop once the 14:30 IST market cutoff is reached.
            if [[ "$NOW" > "14:29" ]]; then
              echo "Market window ended at $NOW IST. Stopping scanner."
              break
            fi

            echo "Running scanner at $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z')"
            python scripts/stock_scanner.py

            # Keep the dashboard data updated after each scan.
            git add data/scanner.json
            if ! git diff --cached --quiet; then
              git config user.name "dashboard-bot"
              git config user.email "actions@users.noreply.github.com"
              git commit -m "Refresh scanner output"

              git fetch origin main
              git rebase origin/main || {
                echo "Rebase conflict; aborting this cycle."
                git rebase --abort
              }

              git push origin HEAD:main || {
                echo "Push was rejected; retrying after rebase."
                git fetch origin main
                git rebase origin/main
                git push origin HEAD:main
              }
            fi

            echo "Sleeping 5 minutes..."
            sleep 300
          done

      - name: Run historical scanner
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'historical'
        run: python scripts/historical_scanner.py --date "${{ inputs.date }}"

      - name: Commit historical output
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'historical'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/historical_scanner_*.json
          git diff --cached --quiet || git commit -m "Refresh historical scanner output"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
