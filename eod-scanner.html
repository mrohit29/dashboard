<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EOD NSE Breakout Scanner</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div><h1>EOD NSE Breakout Scanner</h1><p>Full NSE EQ universe · closing-price range breakouts</p></div><div class="controls"><a href="index.html"><button>← Main dashboard</button></a><button id="refreshBtn">Refresh</button></div></header>
<main class="container"><section class="cards" id="summary"></section><section class="panel"><div class="panel-head"><h2>Breakout horizon</h2><span id="asOf" class="muted"></span></div>
<div class="controls"><label>Range<select id="windowSelect"><option value="1_month">1 month · 21 sessions</option><option value="3_month">3 months · 63 sessions</option><option value="6_month">6 months · 126 sessions</option><option value="1_year">1 year · 252 sessions</option></select></label>
<label>Signal<select id="statusSelect"><option value="ALL">All signals</option><option value="CONFIRMED">Confirmed + volume</option><option value="BREAKOUT_LOW_VOLUME">Breakout · low volume</option><option value="NEAR_BREAKOUT">Within 2% of resistance</option><option value="FAILED_CLOSE">Intraday break, weak close</option></select></label>
<label>Liquidity<select id="liquiditySelect"><option value="ALL">All stocks</option><option value="OK">Avg turnover ≥ ₹50 lakh/day</option></select></label></div>
<div class="table-wrap"><table><thead><tr><th>Stock</th><th>Close</th><th>Resistance</th><th>Distance</th><th>Volume ×</th><th>Avg turnover ₹Cr</th><th>50 DMA</th><th>200 DMA</th><th>Status</th><th>Score</th></tr></thead><tbody id="results"></tbody></table></div></section>
<section class="panel"><div class="panel-head"><h2>Method and limitations</h2></div><div id="notes" class="notes"></div></section></main>
<script>
let payload=null;const fmt=(v,d=2)=>v==null?'—':Number(v).toLocaleString('en-IN',{maximumFractionDigits:d});const money=v=>v==null?'—':'₹'+fmt(v);
function render(){if(!payload)return;const keys=['1_month','3_month','6_month','1_year'];document.getElementById('summary').innerHTML=keys.map(k=>'<div class="card"><div class="label">'+k.replace('_',' ')+'</div><div class="value">'+(payload.counts?.[k]??0)+'</div><div class="label">stocks with a signal</div></div>').join('');document.getElementById('asOf').textContent='EOD data: '+payload.as_of+' · '+payload.symbols_with_full_history+' stocks with 252+ sessions';
const win=document.getElementById('windowSelect').value,status=document.getElementById('statusSelect').value,liq=document.getElementById('liquiditySelect').value;const rows=(payload.windows?.[win]||[]).filter(x=>(status==='ALL'||x.range.status===status)&&(liq==='ALL'||x.liquidity_flag===liq));
document.getElementById('results').innerHTML=rows.map(x=>{const s=x.range.status,cls=s==='CONFIRMED'?'positive':s==='FAILED_CLOSE'?'negative':'';return '<tr><td><strong>'+x.symbol+'</strong></td><td>'+money(x.close)+'</td><td>'+money(x.range.resistance)+'</td><td>'+fmt(x.range.distance_from_resistance_pct)+'%</td><td>'+fmt(x.volume_multiple)+'×</td><td>'+fmt(x.avg_turnover_cr_20d)+'</td><td>'+(x.above_50dma?'Yes':'No')+'</td><td>'+(x.above_200dma?'Yes':'No')+'</td><td class="'+cls+'">'+s.replaceAll('_',' ')+'</td><td>'+x.technical_score+'/7</td></tr>';}).join('')||'<tr><td colspan="10" class="muted">No stocks match these filters for this session.</td></tr>';
document.getElementById('notes').innerHTML='<p><b>Source:</b> '+payload.source+'</p><p>'+payload.method+'</p><p>'+payload.notes.join('<br>')+'</p>';}
async function load(){const r=await fetch('data/eod_breakouts.json?ts='+Date.now());if(!r.ok)throw new Error('EOD data not available. Run the initial history backfill from GitHub Actions.');payload=await r.json();render();}
['windowSelect','statusSelect','liquiditySelect'].forEach(id=>document.getElementById(id).addEventListener('change',render));document.getElementById('refreshBtn').addEventListener('click',()=>load().catch(e=>alert(e.message)));load().catch(e=>document.getElementById('notes').textContent=e.message);
</script></body></html>
